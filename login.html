<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re-Build Tech</title>
    <link rel="stylesheet" href="public/assets/styles/styles.css">
</head>
<body>
    <header class="header">
        <div class="brand">
            <img src="public/assets/images/logo.png" alt="Logo Re-Build Tech">
            <h2>Re-Build Tech</h2>
        </div>

        <nav class="nav">
            <a href="index.html#inicio">Inicio</a>
            <a href="index.html#nosotros">Nosotros</a>
            <a href="index.html#impacto">Impacto</a>
            <a href="materials.html">Materiales</a>
            <a href="dashboard.html#reportes">Reportes</a>
            <a href="index.html#contacto">Contacto</a>
            <a href="#login">Iniciar Sesión</a>
        </nav>
    </header>

    <section class="login-section" id="login">
        <div class="login-copy">
            <h2>Iniciar Sesión</h2>
            <p>Accede a tu cuenta para ver tu consumo de energía.</p>
        </div>

        <form class="login-form">
            <label>
                <span>Correo Electrónico</span>
                <input type="email" placeholder="Ingresa tu correo electrónico">
            </label>

            <label>
                <span>Contraseña</span>
                <input type="password" placeholder="Ingresa tu contraseña">
            </label>

            <div class="login-actions">
                <button class="secondary-btn" type="button">Olvidé mi contraseña</button>
                <a href="dashboard.html" class="primary-btn login-submit" style="text-decoration: none; display: inline-block; text-align: center;">Iniciar Sesión</a>
            </div>
        </form>
    </section>

    <footer class="footer">
        <p>
            <a href="#">Política de Privacidad</a>
            <a href="#">Términos y Condiciones</a>
        </p>
    </footer>
    <script src="public/assets/scripts/main.js"></script>
</body>
</html>
